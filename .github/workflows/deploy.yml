name: CI/CD Pipeline - Parking Management

on:
  push:
    branches: [ "main", "master" ]

jobs:
  # ==========================================
  # JOB 1: BUILD VÀ PUSH DOCKER IMAGE LÊN DOCKER HUB
  # ==========================================
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./parking-lot
          file: ./parking-lot/Dockerfile
          push: true
          tags: huuhuanswe/parking-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./Parking-Lot_FE
          file: ./Parking-Lot_FE/Dockerfile
          push: true
          tags: huuhuanswe/parking-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ==========================================
  # JOB 2: AUTOMATIC DEPLOYMENT LÊN VPS
  # ==========================================
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH to VPS & Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/Huan/Parking-Management
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
