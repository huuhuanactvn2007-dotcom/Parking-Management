services:
  mysql:
    image: mysql:8.0
    container_name: parking-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - parking-net

  redis:
    image: redis:7-alpine
    container_name: parking-redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-123456789}", "--appendonly", "no"]
    networks:
      - parking-net

  backend:
    build:
      context: ./parking-lot
      dockerfile: Dockerfile
    image: huuhuanswe/parking-backend:single-node
    container_name: parking-backend
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MySQLDialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-123456789}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "*"
      MANAGEMENT_ENDPOINT_PROMETHEUS_ENABLED: "true"
      MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED: "true"
      MANAGEMENT_METRICS_DISTRIBUTION_PERCENTILES_HTTP_SERVER_REQUESTS: "0.95,0.99"
    depends_on:
      - mysql
      - redis
    networks:
      - parking-net

  frontend:
    build:
      context: ./Parking-Lot_FE
      dockerfile: Dockerfile
    image: huuhuanswe/parking-frontend:single-node
    container_name: parking-frontend
    restart: always
    depends_on:
      - backend
    networks:
      - parking-net

  gateway:
    image: nginx:alpine
    container_name: parking-gateway
    restart: always
    ports:
      - "8090:8090"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    networks:
      - parking-net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.51.0
    container_name: parking-cadvisor
    restart: always
    privileged: true
    environment:
      - DOCKER_API_VERSION=1.44
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    networks:
      - parking-net

  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: parking-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    networks:
      - parking-net

  grafana:
    image: grafana/grafana:10.3.3
    container_name: parking-grafana
    restart: always
    ports:
      - "4002:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - parking-net

networks:
  parking-net:
    driver: bridge

volumes:
  mysql_data:
  prometheus_data:
  grafana_data:
