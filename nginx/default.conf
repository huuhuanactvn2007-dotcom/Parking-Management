server {
    listen 8090 ssl;
    server_name huan20.io.vn www.huan20.io.vn;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 1. Frontend React SPA
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Proxy sang Spring Boot Backend (Chuyển tiếp đầy đủ Authorization Header)
    location ~ ^/(auth|profile|customers|parking-lots|blocks|parking-slots|parking-slot-reservations|booking-histories|regular-passes|vnpay-payment)/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Chuyển tiếp JWT Token cho Spring Security
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
    }
}
